<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg">
<style>
  :root{--bg:#ffffff;--fg:#0d1117;--muted:#57606a;--line:#d0d7de;--card:#f6f8fa;--soft:#eef2f6;--blue:#0969da}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#f0f6fc;--muted:#8b949e;--line:#30363d;--card:#161b22;--soft:#21262d;--blue:#58a6ff}}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<rect width="1280" height="420" rx="28" fill="var(--bg)"/>
<rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="var(--line)"/>
<text x="70" y="82" font-size="22" fill="var(--muted)">Hi, I’m</text>
<text x="68" y="148" font-size="64" font-weight="750" letter-spacing="-2" fill="var(--fg)">Lucas</text>
<text x="70" y="202" font-size="30" font-weight="650" fill="var(--fg)">Software Engineer · Indie Developer</text>
<text x="70" y="252" font-size="20" fill="var(--muted)">I build production systems, AI-powered tools,</text>
<text x="70" y="282" font-size="20" fill="var(--muted)">and Apple products — from idea to real users.</text>

<g transform="translate(70 322)">
  <rect width="114" height="38" rx="19" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="20" cy="19" r="6" fill="var(--blue)"/><text x="36" y="25" font-size="14" fill="var(--fg)">Full-Stack</text>
  <g transform="translate(126 0)"><rect width="126" height="38" rx="19" fill="var(--card)" stroke="var(--line)"/><circle cx="20" cy="19" r="6" fill="#8250df"/><text x="36" y="25" font-size="14" fill="var(--fg)">Applied AI</text></g>
  <g transform="translate(264 0)"><rect width="152" height="38" rx="19" fill="var(--card)" stroke="var(--line)"/><circle cx="20" cy="19" r="6" fill="#1f883d"/><text x="36" y="25" font-size="14" fill="var(--fg)">Apple Platforms</text></g>
</g>

<g transform="translate(760 62)">
  <rect width="445" height="292" rx="24" fill="var(--card)" stroke="var(--line)"/>
  <rect x="28" y="28" width="389" height="236" rx="16" fill="var(--bg)" stroke="var(--line)"/>
  <circle cx="52" cy="50" r="5" fill="#ff5f56"/><circle cx="70" cy="50" r="5" fill="#ffbd2e"/><circle cx="88" cy="50" r="5" fill="#27c93f"/>
  <rect x="50" y="84" width="92" height="10" rx="5" fill="var(--soft)"/>
  <rect x="50" y="112" width="250" height="12" rx="6" fill="var(--fg)" opacity=".86"/>
  <rect x="50" y="140" width="322" height="9" rx="4.5" fill="var(--soft)"/>
  <rect x="50" y="165" width="286" height="9" rx="4.5" fill="var(--soft)"/>
  <rect x="50" y="205" width="88" height="34" rx="9" fill="var(--fg)"/>
  <text x="68" y="227" font-size="13" font-weight="650" fill="var(--bg)">ship()</text>
  <path d="M330 82c30 18 51 41 67 70-20-7-40-5-61 3 2-23 0-47-6-73Z" fill="var(--blue)" opacity=".14"/>
  <circle cx="368" cy="123" r="30" fill="none" stroke="var(--blue)" stroke-width="10" opacity=".28"/>
  <circle cx="368" cy="123" r="8" fill="var(--blue)"/>
</g>
</svg>